name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax and interface tests
        run: zsh tests/basic.zsh
      - name: Dependency and preparation smoke test
        run: zsh tests/prepare-smoke.zsh
