name: personal
source_baseline: cis_lvl1
title: Personal Mac Security Baseline
description: >-
  A read-only security posture baseline for personally administered Macs
  that are not enrolled in organizational MDM. It is derived from the mSCP
  CIS Level 1 rule selection, replaces managed-enforcement checks with checks
  of effective local state where a reliable macOS interface exists, and removes
  organization-policy-only controls and optional forensic logging controls
  outside the default personal posture scope. It is not a CIS Benchmark
  assessment and does not claim CIS compliance.
