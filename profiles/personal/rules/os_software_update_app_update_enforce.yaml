id: os_software_update_app_update_enforce
title: Verify Automatic App Store Updates Are Enabled
discussion: |
  This check reads the App Store automatic-update preference in the active
  user's context. On supported macOS versions, an explicit false value disables
  automatic updates; an unset value retains the enabled system default.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          auto_update=$(/usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults read com.apple.commerce AutoUpdate 2>/dev/null)
          if [[ "$auto_update" == "0" ]]; then
            echo "false"
          else
            echo "true"
          fi
        result:
          string: 'true'
      fix:
        additional_info: Enable Automatic Updates in App Store > Settings.
mobileconfig_info: []
