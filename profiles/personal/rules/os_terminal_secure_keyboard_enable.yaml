id: os_terminal_secure_keyboard_enable
title: Verify Secure Keyboard Entry Is Enabled in Terminal
discussion: |
  This check reads Terminal's effective Secure Keyboard Entry preference in
  the active user's context rather than the root context of the audit process.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          secure_keyboard=$(/usr/bin/sudo -u "$CURRENT_USER" /usr/bin/defaults read com.apple.Terminal SecureKeyboardEntry 2>/dev/null)
          if [[ "$secure_keyboard" == "1" ]]; then
            echo "true"
          else
            echo "false"
          fi
        result:
          string: 'true'
      fix:
        additional_info: In Terminal, choose Terminal > Secure Keyboard Entry.
mobileconfig_info: []
