id: system_settings_firewall_enable
title: Verify the macOS Application Firewall Is Enabled
discussion: |
  This check queries the effective Application Firewall state. It
  does not require a configuration profile that prevents later changes.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          if /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate 2>/dev/null | /usr/bin/grep -Eq '^Firewall is enabled\. \(State = 1\)$'; then
            echo "true"
          else
            echo "false"
          fi
        result:
          string: 'true'
      fix:
        additional_info: Enable Firewall in System Settings > Network > Firewall.
    '14.0':
      enforcement_info:
        check:
          shell: |-
            if /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate 2>/dev/null | /usr/bin/grep -Eq '^Firewall is enabled\. \(State = 1\)$'; then
              echo "true"
            else
              echo "false"
            fi
          result:
            string: 'true'
mobileconfig_info: []
