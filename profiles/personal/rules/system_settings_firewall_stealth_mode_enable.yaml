id: system_settings_firewall_stealth_mode_enable
title: Verify Firewall Stealth Mode Is Enabled
discussion: |
  This check queries the effective Firewall stealth-mode state. It
  does not require a configuration profile that prevents later changes.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          if /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode 2>/dev/null | /usr/bin/grep -Eq '^Firewall stealth mode is on$'; then
            echo "true"
          else
            echo "false"
          fi
        result:
          string: 'true'
      fix:
        additional_info: Enable stealth mode in the Firewall options in System Settings.
    '14.0':
      enforcement_info:
        check:
          shell: |-
            if /usr/libexec/ApplicationFirewall/socketfilterfw --getstealthmode 2>/dev/null | /usr/bin/grep -Eq '^Firewall stealth mode is on$'; then
              echo "true"
            else
              echo "false"
            fi
          result:
            string: 'true'
mobileconfig_info: []
