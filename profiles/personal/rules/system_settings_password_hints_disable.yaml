id: system_settings_password_hints_disable
title: Verify Password Hints Are Not Displayed
discussion: |
  This check treats an absent RetriesUntilHint preference as the effective off
  state shown by System Settings. A positive retry count enables hint display.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          retries_until_hint=$(/usr/bin/defaults read /Library/Preferences/com.apple.loginwindow RetriesUntilHint 2>/dev/null)
          if [[ -n "$retries_until_hint" && "$retries_until_hint" -gt 0 ]]; then
            echo "1"
          else
            echo "0"
          fi
        result:
          integer: 0
      fix:
        additional_info: Turn off Show password hints in System Settings > Lock Screen.
mobileconfig_info: []
