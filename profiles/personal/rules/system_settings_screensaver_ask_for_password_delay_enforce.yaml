id: system_settings_screensaver_ask_for_password_delay_enforce
title: Verify the Screen Lock Grace Period
discussion: |
  This check queries the effective screen-lock grace period with
  `sysadminctl`. It does not require a screensaver configuration profile.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          screen_lock_status=$(/usr/bin/sudo -u "$CURRENT_USER" /usr/sbin/sysadminctl -screenLock status 2>&1)
          if [[ "$screen_lock_status" == *"screenLock delay is immediate"* ]]; then
            echo "true"
          else
            screen_lock_delay=$(echo "$screen_lock_status" | /usr/bin/sed -nE 's/.*screenLock delay is ([0-9]+) seconds.*/\1/p')
            if [[ -n "$screen_lock_delay" && "$screen_lock_delay" -le "$ODV" ]]; then
              echo "true"
            else
              echo "false"
            fi
          fi
        result:
          string: 'true'
      fix:
        additional_info: Set the password requirement after screen saver or display sleep to the allowed grace period or less.
mobileconfig_info: []
