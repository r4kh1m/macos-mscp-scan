id: system_settings_screensaver_password_enforce
title: Verify Screen Lock Authentication Is Enabled
discussion: |
  This check queries the effective screen-lock state with
  `sysadminctl`. It does not require a screensaver configuration profile.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          if /usr/bin/sudo -u "$CURRENT_USER" /usr/sbin/sysadminctl -screenLock status 2>&1 | /usr/bin/grep -Eq 'screenLock delay is (immediate|[0-9]+ seconds)'; then
            echo "true"
          else
            echo "false"
          fi
        result:
          string: 'true'
      fix:
        additional_info: Require a password after the screen saver begins or the display is turned off.
mobileconfig_info: []
