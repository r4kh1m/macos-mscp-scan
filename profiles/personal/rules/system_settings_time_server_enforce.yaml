id: system_settings_time_server_enforce
title: Verify Automatic Network Time Is Enabled
discussion: |
  This check queries the effective automatic network-time state
  rather than requiring a managed preference.
platforms:
  macOS:
    enforcement_info:
      check:
        shell: |-
          if /usr/sbin/systemsetup -getusingnetworktime 2>/dev/null | /usr/bin/grep -Eq '^Network Time: On$'; then
            echo "true"
          else
            echo "false"
          fi
        result:
          string: 'true'
      fix:
        additional_info: Enable automatic date and time in System Settings > General > Date & Time.
mobileconfig_info: []
